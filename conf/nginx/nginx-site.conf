# Site template for serversideup/php: included inside its server {} block.
# Only ${NGINX_*}, ${PHP_*}… variables are substituted at startup; nginx's own $vars are kept.
listen ${NGINX_HTTP_PORT} default_server;
listen [::]:${NGINX_HTTP_PORT} default_server;

server_name _;
root /var/www/html;
index index.php index.html index.htm;
charset utf-8;
absolute_redirect off;

if ($host = www.pdf4teachers.org) {
    return 301 https://pdf4teachers.org$request_uri;
}

location /healthcheck {
    access_log off;
    fastcgi_read_timeout 5s;
    include        fastcgi_params;
    fastcgi_param  SCRIPT_NAME     /healthcheck;
    fastcgi_param  SCRIPT_FILENAME /healthcheck;
    fastcgi_pass   127.0.0.1:9000;
}

location / {
    try_files $uri $uri/ =404;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include        fastcgi_params;
    fastcgi_buffers $NGINX_FASTCGI_BUFFERS;
    fastcgi_buffer_size $NGINX_FASTCGI_BUFFER_SIZE;
    fastcgi_read_timeout $PHP_MAX_EXECUTION_TIME;
}

location /conf {
    log_not_found off;
    deny all;
}

error_page 403 /403/index.php;
error_page 404 /404/index.php;
error_page 500 /500/index.php;

include /etc/nginx/trusted-proxy/${TRUSTED_PROXY}.conf;
include /etc/nginx/server-opts.d/*.conf;
